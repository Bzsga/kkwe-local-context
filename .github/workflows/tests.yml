name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python 3.10 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install optional Lua bridge test interpreter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run tests including Lua bridge
        if: runner.os == 'Linux'
        env:
          KKLC_LUA: /usr/bin/lua5.4
        run: python -X utf8 -B -m unittest discover -s tests -v
      - name: Run Windows tests
        if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests -v
